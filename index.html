<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Stake Tarot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Tarot x Stake</h1>

    <div class="wallet-info">
      <label for="crypto">Crypto :</label>
      <select id="crypto">
        <option value="BTC">BTC</option>
        <option value="ETH">ETH</option>
      </select>
      <label for="betAmount">Mise :</label>
      <input type="number" id="betAmount" min="0.0001" step="0.0001" value="0.001">
      <button onclick="play()">Tirer</button>
    </div>

    <div class="cards" id="cardsDisplay"></div>
    <div class="result" id="resultDisplay"></div>
  </div>

  <script src="tarot.js"></script>
</body>
</html>
